<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OGGY X — Live AI Voice Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Fullscreen Immersive Canvas -->
  <div id="app-container">
    
    <!-- Character Stage (Dual Video Player for Seamless Crossfade) -->
    <div id="character-stage" class="character-stage">
      <div id="video-wrapper" class="video-wrapper">
        <video id="video-primary" class="oggy-video active" playsinline muted loop></video>
        <video id="video-secondary" class="oggy-video inactive" playsinline muted></video>
      </div>
    </div>

    <!-- Minimal Subtle State Hint (Only visible when active) -->
    <div id="state-pill" class="state-pill hidden">
      <span class="pill-dot"></span>
      <span id="state-text">Listening...</span>
    </div>

    <!-- Hands-Free Wake Word Indicator -->
    <div id="wake-indicator" class="wake-indicator" title="Say 'Listen Oggy' anytime to wake up hands-free!">
      <span class="wake-dot"></span>
      <span id="wake-text" class="wake-label">Wake: "Listen Oggy"</span>
    </div>

    <!-- Hidden Compositor for Universal Picture-in-Picture -->
    <canvas id="pip-canvas" width="640" height="640" style="display:none;"></canvas>
    <video id="pip-video" playsinline muted autoplay style="display:none;"></video>

    <!-- Minimal Bottom Voice & Typing Dock -->
    <div class="bottom-dock">
      <div class="dock-card">
        <!-- Big Push-to-Talk Mic -->
        <button id="btn-mic" class="dock-mic" title="Click to Speak or say 'Listen Oggy'">
          <div class="mic-ripple"></div>
          <svg class="mic-svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>

        <!-- Typing Input -->
        <input type="text" id="text-input" placeholder="Speak or type to Oggy..." autocomplete="off">

        <!-- Send Button -->
        <button id="btn-send" class="dock-send" title="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>

        <!-- Picture-in-Picture Desktop Float Toggle -->
        <button id="btn-pip" class="dock-pip" title="Picture-in-Picture Floating Mode (Float over other tabs & apps)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"></rect>
            <rect x="11" y="9" width="9" height="6" rx="1" fill="currentColor" fill-opacity="0.3"></rect>
            <polyline points="7 17 7 21 17 21 17 17"></polyline>
          </svg>
        </button>

        <!-- Discreet Settings Gear -->
        <button id="btn-settings" class="dock-gear" title="Optional Gemini API Settings">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </div>

  </div>

  <!-- Settings Modal (Optional Gemini API Key) -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>OGGY X Settings</h3>
        <button id="btn-close-modal" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="info-banner">
          <strong> Gemini API Key (100% Optional)</strong>
          <p>If you provide a Google Gemini API key, Oggy can answer open-ended questions using Gemini!</p>
        </div>

        <div class="form-group">
          <label for="gemini-key-input">Gemini API Key:</label>
          <input type="password" id="gemini-key-input" placeholder="AIzaSy...">
          <small id="key-status-text" class="key-status">No key saved (Using local feed)</small>
        </div>

        <div class="modal-actions">
          <button id="btn-clear-key" class="btn-secondary">Clear Key</button>
          <button id="btn-save-key" class="btn-primary">Save Settings</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
